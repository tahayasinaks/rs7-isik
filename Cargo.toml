[package]
name = "rs7-isik"
version = "1.2.1"
edition = "2021"
license = "MIT"
description = "ATK RS7 Air için yerel Rust aydınlatma uygulaması"

[dependencies]
serde_json = "1"
sha2 = "0.10"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_SystemInformation"] }

[profile.release]
lto = true
codegen-units = 1
strip = true



